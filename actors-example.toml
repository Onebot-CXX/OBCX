# actors.toml selects canonical actor packages for an in-tree build. Every
# selected package must provide a valid actor.toml; this file does not repeat
# package identity, ABI, dependency, or publication metadata.
schema_version = 1

[[actors]]
path = "local_actor/obcx-message-store"
enabled = true

[[actors]]
path = "local_actor/obcx-message-bridge"
enabled = true

# Remote actor packages must pin an explicit revision.
# [[actors]]
# repository = "https://github.com/Onebot-CXX/obcx-actor-example.git"
# revision = "v1.0.0"
# enabled = true
