# Keep the repository root stable even when treefmt is invoked from a nested
# local actor repository.
tree-root-file = "flake.nix"

# local_actor/ is intentionally ignored by the root Git repository, so the Git
# walker cannot discover its C++ sources.
walk = "filesystem"

# "**/" needs at least one parent directory, so root entries are listed too.
excludes = [
  ".git/**",
  ".cache/**",
  ".worktrees/**",
  "build*/**",
  "**/.git/**",
  "**/.cache/**",
  "**/.worktrees/**",
  "**/build*/**",
]

[formatter.clang-format]
command = "clang-format"
options = ["-i", "--style=file:.clang-format"]
includes = [
  "benchmarks/**/*.cpp",
  "benchmarks/**/*.hpp",
  "include/**/*.hpp",
  "src/**/*.cpp",
  "src/**/*.hpp",
  "local_actor/**/*.cpp",
  "local_actor/**/*.hpp",
]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix", "**/*.nix"]

[formatter.taplo]
command = "taplo"
options = ["fmt"]
includes = ["*.toml", "**/*.toml"]
