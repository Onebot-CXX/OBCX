services:
  pmhq:
    image: docker.io/linyuchen/pmhq:latest
    container_name: pmhq
    restart: always
    shm_size: "1gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AUTO_LOGIN_QQ: "106046931"
      PMHQ_AUTH_TOKEN: "${PMHQ_AUTH_TOKEN:?Set PMHQ_AUTH_TOKEN}"
      HTTP_PROXY: http://host.docker.internal:20122
      HTTPS_PROXY: http://host.docker.internal:20122
      NO_PROXY: localhost,127.0.0.1,::1,pmhq,llonebot,obcx
    volumes:
      - ./QQ:/root/.config/QQ:rw
    ports:
      - ${OBCX_LLOB_PMHQ_BIND:-127.0.0.1:13000}:13000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:13000/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  llonebot:
    image: docker.io/linyuchen/llbot:latest
    container_name: llonebot
    restart: always
    depends_on:
      pmhq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HTTP_PROXY: http://host.docker.internal:20122
      HTTPS_PROXY: http://host.docker.internal:20122
      NO_PROXY: localhost,127.0.0.1,::1,pmhq,llonebot,obcx

      PROTOCOL_MODE: pmhq
      PMHQ_HOST: pmhq
      PMHQ_PORT: "13000"
    volumes:
      - ./llonebot:/app/llbot/data:rw
    ports:
      - ${OBCX_LLOB_HTTP_BIND:-127.0.0.1:3000}:3000
      - ${OBCX_LLOB_WS_BIND:-127.0.0.1:3001}:3001
      - ${OBCX_LLOB_WEBUI_BIND:-127.0.0.1:3080}:3080
      - ${OBCX_LLOB_SATORI_BIND:-127.0.0.1:5600}:5600
