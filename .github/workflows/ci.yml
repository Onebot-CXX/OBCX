name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Restore pinned actor sources
        run: sh packaging/actors/restore-sources.sh

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Check formatting
        run: nix fmt -- --ci

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-gcc16
            os: ubuntu-24.04
          - name: linux-arm64-gcc16
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Evidence is tied to the feature branch's origin/main merge-base.
          # Check out the PR head rather than GitHub's synthetic merge commit
          # and retain origin/main so the verifier can compute that baseline.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Restore pinned actor sources
        run: sh packaging/actors/restore-sources.sh

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          # Enable flakes + nix command (required to consume flake.nix).
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Prime dev shell
        run: |
          nix develop .#ci --command bash -euo pipefail <<'EOF'
            echo "IN_NIX_SHELL=$IN_NIX_SHELL"
            test -n "$IN_NIX_SHELL"
            echo "CC=$(command -v gcc)"
            echo "CXX=$(command -v g++)"
            g++ --version
            printf '#include <meta>\n' | g++ -std=c++26 -freflection -x c++ -E - >/dev/null
          EOF

      - name: Validate actor registry
        run: |
          nix develop .#ci --command python3 \
            actor-registry/generate_actor_index.py validate
          nix develop .#ci --command python3 \
            actor-registry/generate_actor_index.py generate --check

      - name: Configure
        run: |
          nix develop .#ci --command cmake -G Ninja -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DOBCX_BUILD_TESTS=ON \
            -DOBCX_BUILD_BENCHMARKS=OFF

      - name: Build
        run: nix develop .#ci --command cmake --build build --parallel

      - name: Generate actor-only API documentation
        run: |
          nix develop .#ci --command python3 scripts/generate_api_docs.py

      - name: Run full core tests
        working-directory: build
        run: >-
          nix develop .#ci --command ctest --output-on-failure --parallel 2
          --label-exclude installed-sdk
